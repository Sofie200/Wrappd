<!doctype html>
<html lang="sv">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Urbanist:wght@200;400;500;600;900&display=swap"
            rel="stylesheet"
        />
        <!-- The title is set from VITE_APP_NAME in src/config.js -->
        <title>Wrappd</title>
        <meta
            name="description"
            content="Önskelistor och gåvor för familjen, vännerna eller jobbet. Reservera önskningar – utan att mottagaren ser vad som är på väg."
        />

        <!-- Link previews (Messenger, iMessage, Slack, LinkedIn, …). Crawlers don't run JavaScript, so these
             are the same for every page. The image must be an absolute URL: 1200×630, public/og-image.png -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Wrappd" />
        <meta property="og:locale" content="sv_SE" />
        <meta property="og:url" content="https://wrappd.se/" />
        <meta property="og:title" content="Wrappd – önskelistor och gåvor" />
        <meta
            property="og:description"
            content="Önskelistor och gåvor för familjen, vännerna eller jobbet. Reservera önskningar – utan att mottagaren ser vad som är på väg."
        />
        <meta property="og:image" content="https://wrappd.se/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Wrappds logga: ordet Wrappd med en rosa rosett" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="theme-color" content="#ec5b78" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
